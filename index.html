<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Priel</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <div style="color: var(--text-main); font-weight: 600;">Cargando datos...</div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="login-wrapper">
        <div class="login-box">
            <h1>Finanzas Priel</h1>
            <button id="login-btn-main" class="google-btn">
                <svg version="1.1" viewBox="0 0 48 48" style="width: 18px; height: 18px;">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Ingresar con Google
            </button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app-container" style="display: none; width: 100%; height: 100%;">
        
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="window.toggleSidebar()"></div>
        
        <nav class="sidebar" id="sidebar">
            <button class="close-sidebar-btn" onclick="window.toggleSidebar()">✖</button>
            <div class="logo">Finanzas Priel</div>
            <button class="nav-btn active" onclick="window.switchView('resumen', this)">⊞ Resumen</button>
            <button class="nav-btn" onclick="window.switchView('gastos', this)">▼ Gastos</button>
            <button class="nav-btn" onclick="window.switchView('ingresos', this)">▲ Ingresos / Objetivos</button>
            <button class="nav-btn" onclick="window.switchView('ahorros', this)">◆ Ahorros</button>
            <button class="nav-btn" onclick="window.switchView('estadisticas', this)">▤ Estadísticas</button>
            
            <div class="user-info">
                <span id="user-email">No autenticado</span><br>
                <div id="sidebar-version" style="font-size: 10px; margin-top: 4px; color: #9aa0a6;"></div>
                <a href="#" id="logout-btn" style="color: #d93025; text-decoration: none; margin-top: 10px; display: none; font-weight: 500;">Salir</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="topbar">
                <div class="title">
                    <button class="mobile-menu-btn" onclick="window.toggleSidebar()">☰</button>
                    <h1 id="view-title">Resumen</h1>
                    <button id="logout-btn-mobile" class="topbar-mobile-logout">Salir</button>
                </div>
                <div class="selectors">
                    <select id="mes-selector">
                        <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
                        <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
                        <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
                        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
                    </select>
                    <select id="anio-selector"></select>
                </div>
            </div>

            <!-- CONTENEDOR DINÁMICO DE VISTAS (Aquí se inyecta todo por JS) -->
            <div id="views-container"></div>

        </main>
        
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-btn-bottom active" onclick="window.switchView('resumen', this)"><span class="icon">⊞</span><span class="text">Resumen</span></button>
            <button class="nav-btn-bottom" onclick="window.switchView('gastos', this)"><span class="icon">▼</span><span class="text">Gastos</span></button>
            <button class="nav-btn-bottom" onclick="window.switchView('ingresos', this)"><span class="icon">▲</span><span class="text">Ingresos</span></button>
            <button class="nav-btn-bottom" onclick="window.switchView('ahorros', this)"><span class="icon">◆</span><span class="text">Ahorros</span></button>
            <button class="nav-btn-bottom" onclick="window.switchView('estadisticas', this)"><span class="icon">▤</span><span class="text">Estad.</span></button>
        </nav>
        
    </div>

    <!-- Etiqueta de versión flotante -->
    <div id="floating-version" class="floating-version"></div>

    <!-- CONTENEDOR DINÁMICO DE MODALES -->
    <div id="modals-container"></div>

    <!-- CARGA DE NUESTRO MOTOR JAVASCRIPT -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
